# P0 spike (deterministic, no AI): merge the PR linked to an issue once the reviewer has approved it.
# Prototype of the orchestrator's merge step (SPEC §9.3): the AI reviewer only labels; this job merges
# with plain contents/pull-requests permissions after checking CI and mergeability.
name: "P0 spike: deterministic merge"

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  merge:
    if: github.event.label.name == 'factory:spike_merge' && vars.FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: factory-merge-${{ github.event.issue.number }}
    steps:
      - name: Mint factory App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            ${{ github.event.repository.name }}
            gh_aw_code_factory
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
      - name: Check out factory helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/gh_aw_code_factory
          ref: ${{ vars.FACTORY_REF || 'claude/charming-knuth-6m2xdz' }}
          token: ${{ steps.app.outputs.token }}
          path: .factory
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge linked PR
        working-directory: .factory
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          pip install --quiet pyyaml
          python -m agents.ai_orchestrator.merge --repo "$GITHUB_REPOSITORY" --issue "$ISSUE" \
            --required-check test --wait-seconds 600 \
            --remove-label factory:spike_merge --add-label factory:spike_done --close-issue
