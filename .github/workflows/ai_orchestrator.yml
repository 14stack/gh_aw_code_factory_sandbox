# Factory orchestrator (SPEC §9.3): deterministic, no AI. Moves sub-issues through the DAG, merges approved PRs into
# the story branch, marks the story PR ready, and finishes the story after the human merge.
# Circuit breaker: Actions variables ORCHESTRATOR_ENABLE_AUTO_IMPLEMENT / ORCHESTRATOR_ENABLE_AUTO_MERGE (unset = off).
name: "Factory: orchestrator"
run-name: >-
  ${{ github.event_name == 'workflow_run' && format('Orchestrator: after {0}', github.event.workflow_run.display_title)
  || github.event_name == 'pull_request' && format('Orchestrator: PR #{0} closed', github.event.pull_request.number)
  || github.event_name == 'schedule' && 'Orchestrator: scheduled sweep'
  || 'Orchestrator: manual run' }}

# No issue-event triggers (SPEC D28): every label change would start a run. The orchestrator acts when the splitter
# (story ready to start) or the reviewer (PR approved) finishes, when a factory PR closes (merge), and on the sweep.
on:
  workflow_run:
    workflows: ["Factory: splitter", "Factory: reviewer"]
    types: [completed]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/30 * * * *"  # safety net; events do the real work
  workflow_dispatch:
    inputs:
      story:
        description: "Story issue number (empty: only sweep)"
        required: false

permissions: {}

# One run at a time, repo-wide. GitHub keeps only the newest pending run, so every run also sweeps all stories.
concurrency:
  group: factory-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'sub/') || startsWith(github.head_ref, 'story/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint factory App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            ${{ github.event.repository.name }}
            gh_aw_code_factory
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
      - name: Check out factory helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/gh_aw_code_factory
          ref: ${{ vars.FACTORY_REF || 'claude/charming-knuth-6m2xdz' }}
          token: ${{ steps.app.outputs.token }}
          path: .factory
          persist-credentials: false
      - name: Orchestrate
        working-directory: .factory
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ORCHESTRATOR_ENABLE_AUTO_IMPLEMENT: ${{ vars.ORCHESTRATOR_ENABLE_AUTO_IMPLEMENT }}
          ORCHESTRATOR_ENABLE_AUTO_MERGE: ${{ vars.ORCHESTRATOR_ENABLE_AUTO_MERGE }}
          PR: ${{ github.event.pull_request.number }}
          STORY: ${{ inputs.story }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --sweep --run-url "$RUN_URL")
          [ -n "$PR" ] && args+=(--pr "$PR")
          [ -n "$STORY" ] && args+=(--story "$STORY")
          python3 -m agents.ai_orchestrator.orchestrate "${args[@]}"
