# Factory orchestrator (SPEC §9.3): deterministic, no AI. Moves sub-issues through the DAG, merges approved PRs into
# the story branch, marks the story PR ready, and finishes the story after the human merge.
# Circuit breaker: Actions variables ORCHESTRATOR_ENABLE_AUTO_IMPLEMENT / ORCHESTRATOR_ENABLE_AUTO_MERGE (unset = off).
name: "Factory: orchestrator"
run-name: >-
  ${{ github.event_name == 'issues'
      && format('Orchestrator: #{0} {1} {2}', github.event.issue.number, github.event.action, github.event.label.name)
  || github.event_name == 'pull_request' && format('Orchestrator: PR #{0} closed', github.event.pull_request.number)
  || github.event_name == 'schedule' && 'Orchestrator: scheduled sweep'
  || inputs.issue && format('Orchestrator: #{0} {1}', inputs.issue, inputs.reason || 'manual run')
  || 'Orchestrator: manual sweep' }}

# The only component that starts agents (SPEC D29). It runs when
# - an agent run ends: every agent workflow dispatches it as its last job ("Orchestrator: #41 after Implementer");
# - a human changes a factory label (a new story, answered questions, a resumed item). The factory's own label writes
#   use the run's GITHUB_TOKEN, which starts no workflows, so only human changes start a run here;
# - a human closes a factory PR (the story merge, or a sub-issue PR merged by hand; the orchestrator's own merges
#   re-plan in the same run);
# - hourly, as a safety net for lost events.
on:
  issues:
    types: [labeled, unlabeled]
  pull_request:
    types: [closed]
  schedule:
    - cron: "17 * * * *"  # safety net; events do the real work. GitHub delays or drops scheduled runs under load.
  workflow_dispatch:
    inputs:
      issue:
        description: "Story or sub-issue number (empty: only sweep)"
        required: false
      reason:
        description: "Why this run was started; shown in the run name"
        required: false
      finished_run:
        description: "Id of the agent run that dispatched this one (it is ending)"
        required: false

permissions: {}

# One run at a time, repo-wide. `queue: max` keeps every waiting run (by default GitHub keeps only the newest and
# cancels the rest, which would also drop the `finished_run` an agent handed over). Every run still sweeps all stories.
concurrency:
  group: factory-orchestrator
  cancel-in-progress: false
  queue: max

jobs:
  orchestrate:
    # FACTORY_ENABLED stops the whole factory: with agents off, dispatched runs would count as failed attempts.
    if: >-
      vars.FACTORY_ENABLED == 'true' && (
        github.event_name == 'issues' && startsWith(github.event.label.name, 'factory:') ||
        github.event_name == 'pull_request' && github.event.sender.type != 'Bot' &&
          (startsWith(github.head_ref, 'sub/') || startsWith(github.head_ref, 'story/')) ||
        github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write  # dispatch agents, read their runs
      issues: write  # label writes with the run's token: they start no workflows
    steps:
      - name: Mint factory App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |-
            ${{ github.event.repository.name }}
            gh_aw_code_factory
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
      - name: Check out factory helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/gh_aw_code_factory
          ref: ${{ vars.FACTORY_REF || 'claude/charming-knuth-6m2xdz' }}
          token: ${{ steps.app.outputs.token }}
          path: .factory
          persist-credentials: false
      - name: Orchestrate
        working-directory: .factory
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          WORKFLOW_TOKEN: ${{ github.token }}
          ORCHESTRATOR_ENABLE_AUTO_IMPLEMENT: ${{ vars.ORCHESTRATOR_ENABLE_AUTO_IMPLEMENT }}
          ORCHESTRATOR_ENABLE_AUTO_MERGE: ${{ vars.ORCHESTRATOR_ENABLE_AUTO_MERGE }}
          PR: ${{ github.event.pull_request.number }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          FINISHED_RUN: ${{ inputs.finished_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --sweep --run-url "$RUN_URL")
          [ -n "$PR" ] && args+=(--pr "$PR")
          [ -n "$ISSUE" ] && args+=(--issue "$ISSUE")
          [ -n "$FINISHED_RUN" ] && args+=(--finished-run "$FINISHED_RUN")
          python3 -m agents.ai_orchestrator.orchestrate "${args[@]}"
